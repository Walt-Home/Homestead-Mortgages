name: Deploy Homestead Mortgages

# Everything this app uses now lives in its own GCP project. No shared Cloud
# SQL instance, no shared Artifact Registry, no borrowed service accounts —
# which is what finally makes the IAM boundary structural rather than
# maintained. See docs/decisions.md for why that mattered enough to move.

on:
  push:
    branches: [main]

env:
  GCP_PROJECT: homestead-mortgages
  REGION: us-central1
  ARTIFACT_REPO: homestead-mortgages
  SERVICE: homestead-mortgages-staging
  SQL_INSTANCE: homestead-mortgages-db
  # Least privilege: cloudsql.client, plus accessor on exactly two secrets
  # granted on the secrets themselves rather than project-wide.
  RUNTIME_SA: hm-run@homestead-mortgages.iam.gserviceaccount.com

jobs:
  check:
    runs-on: ubuntu-latest

    # The tests talk to a real database rather than mocking one. Every promise
    # this product makes about who can read whose file, about cascades, and
    # about a stage that only moves forward, is kept by Postgres — and a suite
    # that mocks `@hm/db` cannot see any of it. The concurrent-advance race in
    # services/stage.ts was invisible for exactly as long as the mock was there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homestead_mortgages
          POSTGRES_PASSWORD: homestead_mortgages
          POSTGRES_DB: homestead_mortgages
        # 5433 matches docker-compose.yml, so one DATABASE_URL works in both.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U homestead_mortgages"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://homestead_mortgages:homestead_mortgages@localhost:5433/homestead_mortgages

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate

      # The registry is generated from data/v1-build.csv and committed. This
      # regenerates it in memory and fails on drift, so a sheet edit that was
      # never rebuilt cannot ship a stale requirement set.
      - name: Requirement registry matches the sheet
        run: npm run requirements:verify

      # Same discipline for the design system: tokens.css is generated from
      # packages/brand/tokens.mjs and committed. A color edited in the source
      # but never rebuilt would ship a stylesheet that disagrees with the
      # Tailwind preset — half the app on the new value, half on the old.
      - name: Design tokens match their source
        run: npm run brand:verify

      # The DU tables are generated from Fannie Mae's specification, which is
      # licensed and is deliberately not in this repository. With no
      # DU_SPEC_DIR here, this runs the half of the check that needs no spec:
      # every Du* enum in schema.prisma against the members the generator
      # derived. It says which half it skipped.
      - name: DU tables match the spec
        run: npm run du:verify

      - name: TypeScript
        run: npx tsc -b packages/shared packages/requirements packages/connectors packages/underwriting packages/du packages/db apps/api apps/web

      # There was no eslint config in this repo until now — the dependencies
      # were installed and every workspace's `lint` script called eslint, but
      # nothing was ever authored, so `npm run lint` failed on main from the
      # beginning. It went unnoticed because this job never ran it.
      - name: Lint
        run: npm run lint

      # Creates <db>_test and applies every migration to it. Also the check that
      # the committed migrations actually apply to an empty database, which a
      # `migrate dev` shadow database does not prove.
      - name: Test database
        run: npm run db:test:setup

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Deploying without a Google client id would put up a sign-in page that can
  # never succeed, and the server refuses to boot without one anyway. So the
  # deploy waits for the repo variable rather than shipping a door with no key.
  # Set it once, in the console, and re-run: `gh variable set GOOGLE_CLIENT_ID`.
  awaiting-oauth-client:
    needs: check
    if: vars.GOOGLE_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy skipped
        run: |
          echo "::warning title=Deploy skipped::GOOGLE_CLIENT_ID repo variable is not set."
          echo "Create an OAuth client (Internal, Web application) in the"
          echo "homestead-mortgages project, then:"
          echo "  gh variable set GOOGLE_CLIENT_ID --repo Walt-Home/Homestead-Mortgages"
          echo "See docs/decisions.md → Google sign-in."

  deploy:
    needs: check
    if: vars.GOOGLE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Artifact Registry returns a transient 502 on the manifest push often
      # enough to fail a deploy that was otherwise fine — seen once already,
      # with every layer pushed and only the manifest rejected.
      - name: Build and push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t "$IMAGE" .
          for attempt in 1 2 3; do
            if docker push "$IMAGE"; then
              echo "IMAGE=$IMAGE" >> $GITHUB_ENV
              exit 0
            fi
            echo "push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "docker push failed after 3 attempts"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reached through the Cloud SQL Auth Proxy rather than a public IP:
      # GitHub runners have dynamic addresses, so the alternative is an
      # authorized-network entry wide enough to expose the instance.
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 \
            ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done

      # Through the workspace script, NOT `npx prisma migrate deploy --schema
      # <path>` from the repo root. Prisma 7 takes the datasource URL from
      # prisma.config.ts and looks for that file in the working directory —
      # pointing --schema at the package while standing in the root finds the
      # schema and misses the config, which fails as "datasource.url is
      # required" and reads like a missing secret rather than a wrong cwd.
      - name: Apply migrations
        run: |
          npm ci
          npm run db:generate
          npm run migrate:deploy --workspace=@hm/db
        env:
          DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_MIGRATION_URL }}

      # Sample borrowers, seeded through the real services from the image that
      # was just built — no build on the runner, and the same code the service
      # runs. Idempotent by users.persona_key: a persona that already stands at
      # its target is left alone and reported. It refuses to run unless
      # DEMO_PERSONAS=true, the same flag that mounts the persona sign-in —
      # never set either on a real production deploy.
      #
      # Nine lines: eight walked (or `exists`) plus the Grander row, which is
      # deferred rather than seeded. The script exits non-zero on a drift — a
      # persona standing somewhere its story does not describe — and the
      # sign-in page shows the LIVE state beside each name, so that is a wrong
      # answer on a public page and the deploy stops here rather than ship it.
      # Recovery is by hand and on purpose, because a drift means somebody or
      # something moved a persona and the next run should not erase the
      # evidence: read the DRIFT line for the key, then run this same image
      # against the same database with `--reset <key>` and deploy again.
      #
      # The status is taken by hand because a step runs under `bash -e`: with
      # `OUT=$(docker run …)` the shell aborts at the assignment the moment the
      # container exits non-zero, and the `echo` never runs. That threw away
      # the whole log on the one failure this step exists to catch — the drift
      # line naming which persona and where it stood, and any stack trace from
      # a walk that broke mid-way. Print first, then decide.
      - name: Seed the sample borrowers
        run: |
          set +e
          OUT=$(docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DEMO_PERSONAS=true \
            "$IMAGE" node apps/api/dist/scripts/seed-personas.js --purge-legacy-demo 2>&1)
          code=$?
          set -e
          echo "$OUT"
          test "$code" -eq 0
          test "$(grep -c '^persona ' <<< "$OUT")" -eq 9
        env:
          DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_MIGRATION_URL }}

      # Public, deliberately.
      #
      # The org-wide Domain Restricted Sharing constraint
      # (iam.allowedPolicyMemberDomains) forbids `allUsers` by default, so this
      # project carries an explicit exception — see docs/decisions.md. Without
      # it gcloud does NOT fail here: it logs and continues, leaving a service
      # with no invoker bindings that 403s everything and looks exactly like a
      # broken container. That cost a debugging round once already.
      #
      # Public means the sign-in page is reachable, not that data is. Every
      # /api route past /health and /auth requires a session, and files are
      # scoped to their owner. With sign-in now open to any Google account,
      # ownership is what protects a person's data — see assertFileAccess.
      # PUBLIC_ORIGIN is where hosted vendors send the borrower back — Stripe
      # Identity to /f/:id/identity/return, and Plaid's report webhook. It was
      # never set here, so production has been falling back to the
      # http://localhost:5173 default in config.ts: a return URL pointing at a
      # machine that is not the borrower's. Cloud Run assigns the URL at
      # create time and keeps it, so it can be read before this deploy and
      # passed into it.
      - name: Resolve the service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)" 2>/dev/null || true)
          if [ -z "$URL" ]; then
            # First ever deploy: no service to describe yet. The next deploy
            # picks it up, and nothing in the flow needs it until a hosted
            # vendor is switched on.
            echo "::warning::service does not exist yet; PUBLIC_ORIGIN will be set on the next deploy"
          fi
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          ENV_VARS="NODE_ENV=production,TRUST_PROXY=1,CONNECTOR_MODE=fixture,STATE_GALLERY=true"
          # Sample borrowers on the sign-in page. This mounts a route that
          # mints a real session with no Google credential, so it MUST NEVER be
          # set on a real production deploy — staging runs NODE_ENV=production,
          # which is why nothing in the code can tell the two apart and this
          # flag is the whole of the decision. /api/health reports it, and the
          # check below fails the deploy if it is not what was asked for.
          ENV_VARS="$ENV_VARS,DEMO_PERSONAS=true"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,BANK_PROVIDER=plaid,PLAID_ENV=sandbox,PLAID_PRODUCT=assets"
          ENV_VARS="$ENV_VARS,PLAID_CLIENT_ID=${{ vars.PLAID_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,IDENTITY_PROVIDER=stripe,PROPERTY_DATA_PROVIDER=google_places"
          #
          # STRIPE_ALLOW_LIVE_IDENTITY is deliberately absent, and the secret
          # deliberately names the sandbox key. Live identity collects a real
          # government ID and a real face scan from everyone who walks the
          # flow — biometric data with statutory duties under BIPA and its
          # equivalents — and this deployment has no retention policy. The
          # adapter refuses an sk_live_ key without that flag, so the omission
          # is enforced rather than trusted.
          # Omitted rather than set empty when the URL is not resolvable yet:
          # an empty string is not nullish, so it would defeat the fallback in
          # config.ts instead of deferring to it.
          if [ -n "$SERVICE_URL" ]; then
            ENV_VARS="$ENV_VARS,PUBLIC_ORIGIN=$SERVICE_URL"
            # Registered in the Plaid dashboard. Sent ONLY when the origin
            # resolved, because an unregistered redirect URI makes Plaid reject
            # every link token — not just the OAuth ones — and takes screen 3
            # down completely.
            ENV_VARS="$ENV_VARS,PLAID_REDIRECT_URI=$SERVICE_URL/plaid/return"
          fi
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA }} \
            --add-cloudsql-instances ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} \
            --set-secrets "DATABASE_URL=HOMESTEAD_MORTGAGES_DATABASE_URL_STAGING:latest,SESSION_SECRET=HOMESTEAD_MORTGAGES_SESSION_SECRET:latest,PLAID_SECRET=HOMESTEAD_MORTGAGES_PLAID_SECRET:latest,VENDOR_TOKEN_KEY=HOMESTEAD_MORTGAGES_VENDOR_TOKEN_KEY:latest,STRIPE_SECRET_KEY_SANDBOX=HOMESTEAD_MORTGAGES_STRIPE_SECRET_KEY_SANDBOX:latest,GOOGLE_PLACES_API_KEY=HOMESTEAD_MORTGAGES_GOOGLE_PLACES_API_KEY:latest" \
            --set-env-vars "$ENV_VARS" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 120

      # Belt and braces, and not redundant: --allow-unauthenticated fails
      # SILENTLY when the org policy blocks it. Asserting the binding
      # afterwards and reading it back turns that into a red build instead of a
      # service nobody can open.
      - name: Confirm the service is actually reachable
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --member="allUsers" --role=roles/run.invoker --quiet
          MEMBERS=$(gcloud run services get-iam-policy ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(bindings.members)")
          echo "invokers: $MEMBERS"
          case "$MEMBERS" in
            *allUsers*) echo "service is publicly reachable" ;;
            *) echo "::error::allUsers is not bound — the service will 403 everyone"; exit 1 ;;
          esac

      # A connector that fell back to its fixture is invisible in every other
      # check: the service is up, the database answers, and screen 1 quietly
      # offers three hard-coded addresses. Assert the mix the deploy asked for.
      - name: Confirm the vendors the deploy asked for are the ones running
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)")
          PROVIDERS=$(curl -fsS --max-time 30 "$URL/api/health")
          echo "$PROVIDERS"
          for expected in "plaid-assets (sandbox)" "stripe-identity (test)" "google-places"; do
            case "$PROVIDERS" in
              *"$expected"*) echo "ok: $expected" ;;
              *) echo "::error::expected provider not running: $expected"; exit 1 ;;
            esac
          done
          # An sk_live_ key would make the adapter throw at boot rather than
          # report "(test)", so this doubles as a live-mode tripwire.
          case "$PROVIDERS" in
            *"stripe-identity (LIVE)"*) echo "::error::LIVE Stripe identity on staging"; exit 1 ;;
          esac
          # The sample borrowers are what a tester is sent to look at, and a
          # deploy that silently dropped the flag would leave the sign-in page
          # offering nothing but Google with no error anywhere.
          case "$PROVIDERS" in
            *'"personas":"enabled"'*) echo "ok: sample borrowers are mounted" ;;
            *) echo "::error::DEMO_PERSONAS did not reach the service"; exit 1 ;;
          esac

      # Reachable is not the same as working. A malformed Cloud SQL socket path
      # once produced a deploy where health and every unauthenticated route
      # answered correctly and the first real sign-in 500'd, because nothing
      # anyone tested touched Postgres. /api/health now runs SELECT 1 and
      # returns 503 if it cannot.
      - name: Verify the deployed service can reach its database
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)")
          echo "checking $URL/api/health"
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -fsS --max-time 30 "$URL/api/health") && break
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "$BODY"
          case "$BODY" in
            *'"database":"ok"'*) echo "database reachable from the deployed revision" ;;
            *) echo "::error::deployed service cannot reach its database"; exit 1 ;;
          esac
