name: Deploy to production

# Production is deployed by hand, from main, behind an approval: the
# `production` GitHub environment requires Joe's review before any step
# that touches it runs. It promotes the image the staging deploy built and
# tested for the same commit rather than building again — what runs in
# production is byte for byte what ran on staging — and it differs from the
# staging pipeline in what it refuses to do: no sample borrowers, no demo
# book, no persona sign-in, and a health check that fails if any of them
# reached the service. See docs/decisions.md, "Two environments, one
# configuration".
#
# Order: the servicing app first (the API is told where its door is), then
# the API. Both read `_PROD` secrets; both connect to the production
# instance; the jobs are pointed at the same image.
#
# Before the approval, `resolve` writes what ships to the run's summary:
# every commit since the `production` tag, the areas they touch, and any new
# migration or change to infra/ or a workflow. After the deploy, health must
# report the promoted commit, and `tag` moves the `production` tag to it.
# See docs/decisions.md, "Production says what it runs, and the approver
# sees what ships".

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to promote. It must have deployed to staging, so its image exists."
        required: false
        default: ""

# One promotion at a time. The `production` tag says what production runs
# only if promotions finish in the order they started, and two runs would
# migrate one database at once besides. A second run waits for the first,
# including while the first waits for its approval.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: homestead-mortgages
  REGION: us-central1
  ARTIFACT_REPO: homestead-mortgages
  ENVIRONMENT: production
  SERVICE: homestead-mortgages-production
  SERVICING_SERVICE: homestead-mortgages-production-servicing
  SQL_INSTANCE: homestead-mortgages-prod-db
  # The image names are staging's: one image per commit, promoted, never
  # rebuilt. The tag is the commit.
  STAGING_SERVICE: homestead-mortgages-staging
  RUNTIME_SA: hm-run@homestead-mortgages.iam.gserviceaccount.com
  SERVICING_RUNTIME_SA: hm-servicing-run@homestead-mortgages.iam.gserviceaccount.com

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      image: ${{ steps.pick.outputs.image }}
      servicing_image: ${{ steps.pick.outputs.servicing_image }}
      reports_commit: ${{ steps.pick.outputs.reports_commit }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # The commit to promote must be on main and must have an image: the
      # staging deploy is what builds one, so a commit staging never deployed
      # cannot reach production. The servicing image is built only when its
      # tree changed, so its tag is the newest commit at or before this one
      # that has one. The input reaches the shell through the environment,
      # never spliced into the script.
      - id: pick
        env:
          REQUESTED: ${{ github.event.inputs.sha }}
        run: |
          SHA="$REQUESTED"
          if [ -z "$SHA" ]; then SHA=$(git rev-parse HEAD); fi
          SHA=$(git rev-parse --verify --quiet "$SHA^{commit}") || { echo "::error::'$REQUESTED' is not a commit"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          REPO=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REPO }}
          IMAGE="$REPO/${{ env.STAGING_SERVICE }}:$SHA"
          gcloud artifacts docker images describe "$IMAGE" --project ${{ env.GCP_PROJECT }} >/dev/null 2>&1 \
            || { echo "::error::no image for $SHA; deploy it to staging first"; exit 1; }
          SERVICING_IMAGE=""
          for c in $(git rev-list --max-count=200 "$SHA"); do
            CANDIDATE="$REPO/${{ env.STAGING_SERVICE }}-servicing:$c"
            if gcloud artifacts docker images describe "$CANDIDATE" --project ${{ env.GCP_PROJECT }} >/dev/null 2>&1; then
              SERVICING_IMAGE="$CANDIDATE"; break
            fi
          done
          test -n "$SERVICING_IMAGE" || { echo "::error::no servicing image at or before $SHA"; exit 1; }
          # Whether the API image says which commit it is: staging bakes the
          # commit in since the Dockerfile set BUILD_COMMIT, and an image built
          # before that reports none, which the deploy's check then says
          # rather than fails on.
          DOCKERFILE=$(git show "$SHA:Dockerfile")
          if grep -qE '^ENV .*BUILD_COMMIT=' <<< "$DOCKERFILE"; then REPORTS=true; else REPORTS=false; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "servicing_image=$SERVICING_IMAGE" >> "$GITHUB_OUTPUT"
          echo "reports_commit=$REPORTS" >> "$GITHUB_OUTPUT"
          echo "promoting $IMAGE and $SERVICING_IMAGE"

      # What ships, said where the approver reads it. This job names no
      # environment, so it runs before the `production` gate, and the run's
      # page carries this summary while the approval is being asked for.
      # What production runs is the `production` tag, which the `tag` job
      # moves after every promotion that succeeds. Beside it, what the
      # service says: the commit its /api/health reports, or for an image
      # too old to report one, the commit its image is tagged with. Before
      # the first promotion that stands in for the tag, and when the two
      # disagree (a revision rolled back by hand) the summary says so.
      # scripts/promotion-summary.mjs writes the range, the areas it touches
      # and what deserves a second look (a new migration, infra/, a
      # workflow), each also an annotation; its Markdown goes straight to
      # the summary and never through the log.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Say what ships
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          IMAGE: ${{ steps.pick.outputs.image }}
          SERVICING_IMAGE: ${{ steps.pick.outputs.servicing_image }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=""
          LISTED=$(git ls-remote origin refs/tags/production)
          if [ -n "$LISTED" ]; then
            git fetch --no-tags --force origin "+refs/tags/production:refs/tags/production"
            TAG=$(git rev-parse "refs/tags/production^{commit}")
          fi
          describe() {
            gcloud run services describe "$1" \
              --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
              --format="value($2)" 2>/dev/null || true
          }
          RUNNING_IMAGE=$(describe ${{ env.SERVICE }} "spec.template.spec.containers[0].image")
          SERVICING_RUNNING=$(describe ${{ env.SERVICING_SERVICE }} "spec.template.spec.containers[0].image")
          URL=$(describe ${{ env.SERVICE }} "status.url")
          RUNNING=""
          if [ -n "$URL" ]; then
            RUNNING=$(curl -fsS --max-time 30 "$URL/api/health" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
          fi
          SOURCE="production's /api/health"
          if [ -z "$RUNNING" ]; then
            RUNNING=$(sed -nE 's/^.*:([0-9a-f]{40})$/\1/p' <<< "$RUNNING_IMAGE")
            SOURCE="the image Cloud Run's production service was last deployed with"
          fi
          echo "production tag: ${TAG:-none}; ${SOURCE}: ${RUNNING:-none}"
          node scripts/promotion-summary.mjs "$SHA" \
            --production-tag "$TAG" \
            --running "$RUNNING" \
            --running-source "$SOURCE" \
            --api-image "$IMAGE" \
            --servicing-image "$SERVICING_IMAGE" \
            --servicing-running "$SERVICING_RUNNING" \
            --repository "$REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  deploy-servicing:
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      SERVICING_IMAGE: ${{ needs.resolve.outputs.servicing_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 \
            ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Apply the servicing app's migrations
        run: |
          set +e
          OUT=$(docker run --rm --network host \
            -e SERVICING_DATABASE_URL="$SERVICING_DATABASE_URL" \
            "$SERVICING_IMAGE" migrate 2>&1)
          code=$?
          set -e
          echo "$OUT" | grep -v '^skip ' || true
          echo "skipped: $(grep -c '^skip ' <<< "$OUT"), applied: $(grep -c '^apply ' <<< "$OUT")"
          test "$code" -eq 0
        env:
          SERVICING_DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_SERVICING_MIGRATION_URL }}
      # No demo seed: production holds no hundred-loan batch and no sample
      # book. The first admin is the one row nothing else can create.
      - name: Stand the console's first admin
        run: |
          set +e
          OUT=$(docker run --rm --network host \
            -e SERVICING_DATABASE_URL="$SERVICING_DATABASE_URL" \
            -e SERVICING_ENVIRONMENT=nonprod \
            -e SERVICING_INTEGRATIONS=fake \
            -e STAFF_BOOTSTRAP_ADMIN_ROLES=admin,ops_analyst,officer,compliance \
            "$SERVICING_IMAGE" staff-bootstrap "$FIRST_ADMIN" 2>&1)
          code=$?
          set -e
          echo "$OUT"
          test "$code" -eq 0
          grep -q 'staff-bootstrap' <<< "$OUT"
        env:
          SERVICING_DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_SERVICING_MIGRATION_URL }}
          FIRST_ADMIN: ${{ vars.SERVICING_FIRST_ADMIN || 'joe@trywalt.ai' }}
      # SERVICING_ENVIRONMENT stays `nonprod` and the integrations `fake` even
      # here: every vendor in the servicing app is a FAKE, its config refuses
      # to start a production process on fakes, and `nonprod` is what admits
      # the shared token at its door. That is the honest state of the
      # servicing app until a real vendor is wired into it.
      - name: Deploy the servicing service to Cloud Run
        run: |
          ENV_VARS="NODE_ENV=production,SERVICING_PORT=8080,SERVICING_ENVIRONMENT=nonprod,SERVICING_INTEGRATIONS=fake,SERVICING_LOG_FORMAT=json"
          PUBLIC_HOST=$(printf '%s' "$PUBLIC_HOST" | tr ',;' '  ' | awk '{print $1}')
          if [ -n "$PUBLIC_HOST" ]; then
            ENV_VARS="$ENV_VARS,OPS_URL=https://$PUBLIC_HOST/ops,BORROWER_RP_ID=$PUBLIC_HOST,BORROWER_ORIGINS=https://$PUBLIC_HOST"
          fi
          gcloud run deploy ${{ env.SERVICING_SERVICE }} \
            --image "$SERVICING_IMAGE" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.SERVICING_RUNTIME_SA }} \
            --add-cloudsql-instances ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} \
            --set-secrets "SERVICING_DATABASE_URL=HOMESTEAD_MORTGAGES_SERVICING_DATABASE_URL_PROD:latest,SERVICING_API_TOKEN=HOMESTEAD_MORTGAGES_SERVICING_API_TOKEN_PROD:latest" \
            --set-env-vars "$ENV_VARS" \
            --no-allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 2 \
            --timeout 300
        env:
          PUBLIC_HOST: ${{ vars.SERVICING_PUBLIC_HOST }}
      - name: Point the scheduled sweep at this image
        run: |
          gcloud run jobs update ${{ env.SERVICING_SERVICE }}-sweep \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --image "$SERVICING_IMAGE" --quiet
      - name: Confirm the servicing revision is Ready and only the API's identity may invoke it
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICING_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --member="serviceAccount:${{ env.RUNTIME_SA }}" --role=roles/run.invoker --quiet >/dev/null
          gcloud run services remove-iam-policy-binding ${{ env.SERVICING_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --member="allUsers" --role=roles/run.invoker --quiet >/dev/null 2>&1 || true
          READY=$(gcloud run services describe ${{ env.SERVICING_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.conditions[0].status)")
          echo "Ready: $READY"
          test "$READY" = "True"
          MEMBERS=$(gcloud run services get-iam-policy ${{ env.SERVICING_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} --format=json \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print(" ".join(m for b in p.get("bindings",[]) if b["role"]=="roles/run.invoker" for m in b["members"]))')
          echo "invokers: $MEMBERS"
          case " $MEMBERS " in *" allUsers "*) echo "::error::the servicing service is public"; exit 1 ;; esac

  deploy:
    needs: [resolve, deploy-servicing]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 \
            ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Apply migrations
        run: |
          npm ci
          npm run db:generate
          npm run migrate:deploy --workspace=@hm/db
        env:
          DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_MIGRATION_URL }}
      - name: Fetch the average prime offer rates
        run: |
          set +e
          OUT=$(docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e APOR_PROVIDER=ffiec \
            "$IMAGE" node apps/api/dist/scripts/fetch-apor.js 2>&1)
          code=$?
          set -e
          echo "$OUT"
          test "$code" -eq 0
          grep -q 'covers this week: true' <<< "$OUT"
        env:
          DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_MIGRATION_URL }}
      # No sample borrowers. `seed-personas` would refuse anyway — it runs
      # only with DEMO_PERSONAS=true in its own environment — and nothing
      # here sets it.
      - name: Review the watched loans
        run: |
          set +e
          OUT=$(docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" node apps/api/dist/scripts/review-loans.js 2>&1)
          code=$?
          set -e
          echo "$OUT"
          test "$code" -eq 0
          grep -qE '^reviewed [0-9]+ of [0-9]+ monitored loans' <<< "$OUT"
        env:
          DATABASE_URL: ${{ secrets.HOMESTEAD_MORTGAGES_MIGRATION_URL }}
      - name: Resolve the service URLs
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)" 2>/dev/null || true)
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          SURL=$(gcloud run services describe ${{ env.SERVICING_SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)")
          test -n "$SURL"
          echo "SERVICING_URL=$SURL" >> "$GITHUB_ENV"
      # What differs from staging, and why: no DEMO_PERSONAS (the sample
      # sign-in is never mounted here, and the health check below fails if
      # it is), no STATE_GALLERY, and every secret is the `_PROD` one. The
      # vendors are the same sandbox vendors staging has until production
      # keys exist; PUBLIC_ORIGIN and SERVICING_PUBLIC_HOST are the
      # environment's variables and empty until the roots are cut over.
      # Plaid is the first to cross (5 October 2026): the environment's
      # PLAID_ENV says `production`, and then the secret is the `_PROD` one.
      # Unset, it is the sandbox and the sandbox's secret, as before.
      - name: Deploy to Cloud Run
        run: |
          ENV_VARS="NODE_ENV=production,TRUST_PROXY=1,CONNECTOR_MODE=fixture"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          PLAID_ENV_NAME="${{ vars.PLAID_ENV || 'sandbox' }}"
          PLAID_SECRET_NAME=HOMESTEAD_MORTGAGES_PLAID_SECRET
          if [ "$PLAID_ENV_NAME" = "production" ]; then
            PLAID_SECRET_NAME=HOMESTEAD_MORTGAGES_PLAID_SECRET_PROD
          elif [ "$PLAID_ENV_NAME" != "sandbox" ]; then
            echo "::error::PLAID_ENV is '$PLAID_ENV_NAME'; it is sandbox or production"; exit 1
          fi
          # The product is the production environment's PLAID_PRODUCT: `cra`
          # since 7 October 2026, when a probe found the production account
          # enabled for the consumer-report products and for nothing else —
          # on `assets` the bank screen could not open Link at all. Unset is
          # the stand-in.
          PLAID_PRODUCT="${{ vars.PLAID_PRODUCT || 'assets' }}"
          case "$PLAID_PRODUCT" in
            assets|cra) ;;
            *) echo "::error::PLAID_PRODUCT is '$PLAID_PRODUCT'; it is assets or cra"; exit 1 ;;
          esac
          ENV_VARS="$ENV_VARS,BANK_PROVIDER=plaid,PLAID_ENV=$PLAID_ENV_NAME,PLAID_PRODUCT=$PLAID_PRODUCT"
          ENV_VARS="$ENV_VARS,PLAID_CLIENT_ID=${{ vars.PLAID_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,IDENTITY_PROVIDER=stripe,PROPERTY_DATA_PROVIDER=google_places"
          SECRETS="DATABASE_URL=HOMESTEAD_MORTGAGES_DATABASE_URL_PROD:latest,SESSION_SECRET=HOMESTEAD_MORTGAGES_SESSION_SECRET_PROD:latest,PLAID_SECRET=$PLAID_SECRET_NAME:latest,VENDOR_TOKEN_KEY=HOMESTEAD_MORTGAGES_VENDOR_TOKEN_KEY_PROD:latest,STRIPE_SECRET_KEY_SANDBOX=HOMESTEAD_MORTGAGES_STRIPE_SECRET_KEY_SANDBOX:latest,GOOGLE_PLACES_API_KEY=HOMESTEAD_MORTGAGES_GOOGLE_PLACES_API_KEY:latest"
          if [ "${{ vars.PROPERTY_RECORDS_PROVIDER }}" = "corelogic" ]; then
            ENV_VARS="$ENV_VARS,PROPERTY_RECORDS_PROVIDER=corelogic"
            SECRETS="$SECRETS,CORELOGIC_CLIENT_KEY=HOMESTEAD_MORTGAGES_CORELOGIC_CLIENT_KEY:latest,CORELOGIC_CLIENT_SECRET=HOMESTEAD_MORTGAGES_CORELOGIC_CLIENT_SECRET:latest"
          fi
          # Invoicing through Stripe once the production environment's
          # INVOICING_PROVIDER is "stripe". The key is production's own
          # (_PROD), and a LIVE key is refused by the adapter — the service
          # will not start — unless the environment's STRIPE_ALLOW_LIVE_BILLING
          # is "true": issuing real invoices is a decision, not a default.
          if [ "${{ vars.INVOICING_PROVIDER }}" = "stripe" ]; then
            ENV_VARS="$ENV_VARS,INVOICING_PROVIDER=stripe"
            SECRETS="$SECRETS,STRIPE_BILLING_KEY=HOMESTEAD_MORTGAGES_STRIPE_BILLING_KEY_PROD:latest"
            if [ "${{ vars.STRIPE_ALLOW_LIVE_BILLING }}" = "true" ]; then
              ENV_VARS="$ENV_VARS,STRIPE_ALLOW_LIVE_BILLING=true"
            fi
            if [ "${{ vars.BILLING_WEBHOOK }}" = "on" ]; then
              SECRETS="$SECRETS,STRIPE_BILLING_WEBHOOK_SECRET=HOMESTEAD_MORTGAGES_STRIPE_BILLING_WEBHOOK_SECRET_PROD:latest"
            fi
          fi
          ENV_VARS="$ENV_VARS,APOR_PROVIDER=ffiec"
          ENV_VARS="$ENV_VARS,SERVICING_PROVIDER=supermortgage,SERVICING_API_URL=$SERVICING_URL"
          SECRETS="$SECRETS,SERVICING_API_TOKEN=HOMESTEAD_MORTGAGES_SERVICING_API_TOKEN_PROD:latest"
          if [ -n "$SERVICING_PUBLIC_HOST" ]; then
            ENV_VARS="$ENV_VARS,SERVICING_PUBLIC_HOST=$SERVICING_PUBLIC_HOST"
          fi
          # Outbound mail goes through Resend once a verified sender is named
          # (the MAIL_FROM variable, "Name <address>" on a domain Resend has
          # verified). Unset, the mailer stays the stand-in and every
          # invitation reports "not delivered" with the link to hand over.
          if [ -n "$MAIL_FROM" ]; then
            ENV_VARS="$ENV_VARS,MAIL_PROVIDER=resend,MAIL_FROM=$MAIL_FROM"
            SECRETS="$SECRETS,RESEND_API_KEY=HOMESTEAD_MORTGAGES_RESEND_API_KEY:latest"
          fi
          # Staging's fence: whole addresses (a tester's inbox) or domains it may
          # write to beyond our own. Space-separated; ignored where there is no fence.
          if [ -n "$MAIL_ALLOWED_ADDRESSES" ]; then
            ENV_VARS="$ENV_VARS,MAIL_ALLOWED_ADDRESSES=$MAIL_ALLOWED_ADDRESSES"
          fi
          if [ -n "$MAIL_ALLOWED_DOMAINS" ]; then
            ENV_VARS="$ENV_VARS,MAIL_ALLOWED_DOMAINS=$MAIL_ALLOWED_DOMAINS"
          fi
          # E-mailing the homeowners on a servicer's book is off unless this
          # environment's PRODUCTION_HOMEOWNER_MAIL says `on`. Unset is off,
          # and off is the API's own default on a deployment. The name is
          # production's own on purpose: GitHub resolves `vars.X` from the
          # environment first and then the repository, and the repository's
          # HOMEOWNER_MAIL is staging's (`on` since 8 October), which is how
          # production came to deploy with it on, on 21 October.
          if [ "${{ vars.PRODUCTION_HOMEOWNER_MAIL }}" = "on" ]; then
            ENV_VARS="$ENV_VARS,HOMEOWNER_MAIL=on"
          fi
          ORIGIN="${PUBLIC_ORIGIN:-$SERVICE_URL}"
          if [ -n "$ORIGIN" ]; then
            ENV_VARS="$ENV_VARS,PUBLIC_ORIGIN=$ORIGIN"
            ENV_VARS="$ENV_VARS,PLAID_REDIRECT_URI=$ORIGIN/plaid/return"
          fi
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.RUNTIME_SA }} \
            --add-cloudsql-instances ${{ env.GCP_PROJECT }}:${{ env.REGION }}:${{ env.SQL_INSTANCE }} \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENV_VARS" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 3 \
            --timeout 300
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          SERVICING_PUBLIC_HOST: ${{ vars.SERVICING_PUBLIC_HOST }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_ALLOWED_ADDRESSES: ${{ vars.MAIL_ALLOWED_ADDRESSES }}
          MAIL_ALLOWED_DOMAINS: ${{ vars.MAIL_ALLOWED_DOMAINS }}
      # The three jobs every stack has are required: a missing one is a
      # stack that never closes a month, and the deploy should say so. The
      # reconcile job exists only where invoicing is on — Terraform makes it
      # with the stack's `invoicing` switch — so it is repointed only when
      # this environment invoices through Stripe, and named as skipped
      # otherwise. (2 October 2026: production's first promotion with the
      # invoicing code failed here, on a job it had no reason to have.)
      - name: Point the scheduled jobs at this image
        run: |
          for JOB in ${{ env.SERVICE }}-apor-fetch ${{ env.SERVICE }}-loan-review ${{ env.SERVICE }}-billing-close; do
            gcloud run jobs update "$JOB" --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} --image "$IMAGE" --quiet
          done
          if [ "${{ vars.INVOICING_PROVIDER }}" = "stripe" ]; then
            gcloud run jobs update "${{ env.SERVICE }}-billing-reconcile" --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} --image "$IMAGE" --quiet
          else
            echo "invoicing is not on for this environment; there is no ${{ env.SERVICE }}-billing-reconcile job to repoint (Terraform makes it when the stack's invoicing switch is on)."
          fi
      - name: Confirm the service is reachable and is production
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --member="allUsers" --role=roles/run.invoker --quiet >/dev/null
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)")
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -fsS --max-time 30 "$URL/api/health") && break
            echo "attempt $attempt failed; retrying"
            sleep 10
          done
          echo "$BODY"
          case "$BODY" in
            *'"database":"ok"'*) echo "ok: database reachable" ;;
            *) echo "::error::the deployed service cannot reach its database"; exit 1 ;;
          esac
          case "$BODY" in
            *'"personas":"enabled"'*) echo "::error::sample borrowers are mounted on production"; exit 1 ;;
            *) echo "ok: no sample sign-in" ;;
          esac
          case "$BODY" in
            *"stripe-identity (LIVE)"*) echo "::warning::LIVE Stripe identity is on" ;;
          esac
          # The console's host is public, so a staff sign-in code that the
          # page shows instead of a mailbox receiving it is one factor, not
          # two — and this is the deployment that holds a servicer's book.
          case "$BODY" in
            *'"staffSignInCodes":"mailed"'*) echo "ok: a staff sign-in code is mailed, never shown" ;;
            *) echo "::error::the console would show a staff sign-in code on the page; MAIL_PROVIDER must be a real mailer here"; exit 1 ;;
          esac
          # A fixed code passing the second step is a staging convenience
          # that rides the sample-sign-in flag; here it is one factor short.
          case "$BODY" in
            *'"secondFactor":"authenticator only"'*) echo "ok: the second step takes an authenticator and nothing else" ;;
            *) echo "::error::the second step of sign-in accepts a demo code on production"; exit 1 ;;
          esac
          # Said out loud on every promotion, whichever way it is set.
          case "$BODY" in
            *'"homeownerMail":"on"'*)
              if [ "${{ vars.PRODUCTION_HOMEOWNER_MAIL }}" = "on" ]; then
                echo "::warning::the tape desk CAN e-mail the homeowners on a servicer's book (PRODUCTION_HOMEOWNER_MAIL=on); each send is still one person's confirmed act"
              else
                echo "::error::homeowner mail is on, but production's PRODUCTION_HOMEOWNER_MAIL does not say on"; exit 1
              fi ;;
            *'"homeownerMail":"off"'*) echo "ok: no homeowner can be e-mailed from this deployment" ;;
            *) echo "::error::the deployed service does not say whether homeowners can be e-mailed"; exit 1 ;;
          esac
          case "$BODY" in
            *"plaid-cra (production)"*) echo "ok: bank connections are Plaid's production, and the report is the consumer report" ;;
            *"plaid-assets (production)"*) echo "::warning::bank connections are Plaid's production on the assets stand-in; CRD-017 stays unsatisfied until PLAID_PRODUCT=cra" ;;
            *"(sandbox)"*"plaid"*|*"plaid"*"(sandbox)"*) echo "::warning::bank connections are Plaid's sandbox" ;;
          esac
          case "$BODY" in
            *"supermortgage ($SERVICING_URL)"*) echo "ok: the servicing port reads $SERVICING_URL" ;;
            *) echo "::error::the servicing port is not reading the production servicing service"; exit 1 ;;
          esac
          case "$BODY" in
            *'"coversThisWeek":true'*) echo "ok: the APOR series covers this week" ;;
            *) echo "::error::the APOR series does not cover this week"; exit 1 ;;
          esac
      # Production says what it runs: /api/health reports the commit its
      # image was built from, baked in when staging built it, and this run
      # promoted the image staging built for the commit `resolve` chose. The
      # two must be one commit; anything else (an older revision still
      # answering, an image that is not the one resolved) fails here, before
      # the tag moves. An image staging built before the commit was baked in
      # reports none, and promoting one is said out loud rather than failed.
      - name: Confirm production runs the commit it promoted
        env:
          EXPECTED: ${{ needs.resolve.outputs.sha }}
          REPORTS_COMMIT: ${{ needs.resolve.outputs.reports_commit }}
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} --project ${{ env.GCP_PROJECT }} \
            --format="value(status.url)")
          reported() {
            curl -fsS --max-time 30 "$URL/api/health" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")'
          }
          COMMIT=$(reported || true)
          if [ "$REPORTS_COMMIT" != "true" ] && [ -z "$COMMIT" ]; then
            echo "::warning::$EXPECTED was built before the image carried its commit, so production's health names none; a promotion of a newer commit will"
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            [ "$COMMIT" = "$EXPECTED" ] && break
            echo "attempt $attempt: health reports ${COMMIT:-no commit}; retrying"
            sleep 10
            COMMIT=$(reported || true)
          done
          if [ "$COMMIT" != "$EXPECTED" ]; then
            echo "::error::production's health reports commit ${COMMIT:-none}, not $EXPECTED, which this run promoted"
            exit 1
          fi
          echo "ok: production runs $EXPECTED"

  # The record of what production runs: the `production` tag, moved to the
  # commit just promoted once health has reported it. The next promotion's
  # summary measures from here. A job of its own because it is the one that
  # writes to this repository — `contents: write` here and on no other job —
  # and it names no environment: each job naming `production` asks for an
  # approval of its own, and this one only follows the two that were
  # approved. It installs nothing and holds no secret. A tag and never a
  # branch: nothing is built from it, and a rollback moves it back.
  tag:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Move the production tag to the promoted commit
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          git tag --force production "$SHA"
          git push --force origin refs/tags/production
          echo "production -> $SHA"
          echo "The \`production\` tag names \`$SHA\`, which production now runs." >> "$GITHUB_STEP_SUMMARY"
