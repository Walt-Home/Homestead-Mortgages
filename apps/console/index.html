<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermortgage</title>
    <meta name="robots" content="noindex" />
    <!-- No web fonts, deliberately: the brand is Georgia and Helvetica Neue as installed. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#FCFCFC" />
  </head>
  <body>
    <!--
      What the page shows before the script has arrived, in the same shape
      the app draws while it signs you in, so the first paint is never a
      blank canvas. React replaces it on mount. The mark carries no "Ops":
      this door is a servicer's team's too, and nobody knows yet which of
      the two is arriving.
    -->
    <style>
      @keyframes console-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .console-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #fafafa;
        color: #111113;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .console-splash-mark {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .console-splash-ring {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #dcdce0;
        border-top-color: #bf242b;
        animation: console-splash-spin 0.8s linear infinite;
      }
      .console-splash-text {
        font-weight: 500;
      }
    </style>
    <div id="root">
      <div class="console-splash" role="status" aria-live="polite">
        <div class="console-splash-mark">Supermortgage</div>
        <div class="console-splash-ring" aria-hidden="true"></div>
        <div class="console-splash-text">Signing you in…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
