<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supermortgage</title>
    <meta
      name="description"
      content="A mortgage application in five screens. Connect your accounts instead of hunting for statements."
    />
    <!--
      No web fonts, deliberately.

      The brand is Georgia and Helvetica Neue as installed — see
      packages/brand/tokens.mjs and docs/brand.md. That means no render-blocking
      stylesheet, no layout shift, and no third-party request before sign-in.
      If a licensed face is adopted, its @font-face goes in
      packages/brand/base.css and the stack changes in tokens.mjs; this file
      does not change.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
